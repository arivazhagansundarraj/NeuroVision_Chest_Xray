<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PulmoScan{% endblock %} – PulmoScan Chest X-Ray</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2322d3ee' d='M11 2.5a1 1 0 0 1 2 0V9l3 2.2a1 1 0 1 1-1.2 1.6L13 11.5V8h-2v3.5l-1.8 1.3A1 1 0 1 1 8 11.2L11 9z'/%3E%3Cpath fill='%2322d3ee' d='M9.3 9.5C6.6 10.6 4.3 14.4 3.8 18c-.3 2.2 1.100 3.2 2.900 2.800 1.700-.4 2.700-1.600 2.700-3.200z'/%3E%3Cpath fill='%2322d3ee' d='M14.7 9.5c2.700 1.100 5 4.900 5.500 8.500.3 2.200-1.100 3.200-2.900 2.800-1.700-.4-2.700-1.600-2.700-3.200z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('dashboard') }}">
        <svg class="logo" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
          <path fill="currentColor" d="M11 2.5a1 1 0 0 1 2 0V9l3 2.2a1 1 0 1 1-1.2 1.6L13 11.5V8h-2v3.5l-1.8 1.3A1 1 0 1 1 8 11.2L11 9z"/>
          <path fill="currentColor" fill-opacity=".85" d="M9.3 9.5C6.6 10.6 4.3 14.4 3.8 18c-.3 2.2 1.1 3.2 2.9 2.8 1.7-.4 2.7-1.6 2.7-3.2z"/>
          <path fill="currentColor" fill-opacity=".85" d="M14.7 9.5c2.7 1.1 5 4.9 5.5 8.5.3 2.2-1.1 3.2-2.9 2.8-1.7-.4-2.7-1.6-2.7-3.2z"/>
        </svg>
        <b>Pulmo<em>Scan</em></b>
      </a>
      <nav>
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
        <a href="{{ url_for('analysis') }}" class="{{ 'active' if active == 'analysis' }}">X-ray Analysis</a>
        <a href="{{ url_for('system') }}" class="{{ 'active' if active == 'system' }}">About System</a>
        <a href="{{ url_for('pneumonia') }}" class="{{ 'active' if active == 'pneumonia' }}">About Pneumonia</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container">© PulmoScan · AI chest X-ray classification (educational use only)</div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
